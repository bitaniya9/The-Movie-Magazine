<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moview Reviews</title>
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Welcome !</h2>
      <form class="signIn-form">
        <label>Name</label>
        <input type="text" title="name" name="name" />
        <br />
        <label>Email</label>
        <input type="text" title="email" name="email" />

        <br />
        <label>Password</label>
        <p class="error" id="passwordError"></p>
        <input type="text" title="password" name="password" />

        <label>Confirm Password</label>
        <p class="error" id="confirmError"></p>
        <input type="text" title="password" name="confirmPassword" />

        <button type="submit" class="login-button">Sign up</button>
        <h3>Already have an account? <a href="login.html">Login</a></h3>
      </form>
    </div>
    <script type="module" src="./js/pages/register.js"></script>
  </body>
</html>
